<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#10b981"/>
  
  <!-- Graduation cap -->
  <g transform="translate(100, 85)">
    <rect x="-45" y="-8" width="90" height="12" rx="2" fill="#ffffff"/>
    <polygon points="0,-8 -55,-30 55,-30" fill="#059669"/>
    <line x1="0" y1="-8" x2="0" y2="15" stroke="#ffffff" stroke-width="3"/>
    <circle cx="20" cy="18" r="3" fill="#fbbf24"/>
  </g>
  
  <!-- Book below -->
  <g transform="translate(100, 130)">
    <rect x="-25" y="0" width="50" height="35" rx="4" fill="#a7f3d0" stroke="#ffffff" stroke-width="2"/>
    <line x1="-20" y1="8" x2="20" y2="8" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-20" y1="16" x2="20" y2="16" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-20" y1="24" x2="20" y2="24" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>