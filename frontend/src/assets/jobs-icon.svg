<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  
  <!-- Briefcase -->
  <g>
    <!-- Main body -->
    <rect x="50" y="60" width="100" height="70" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
    
    <!-- Top handle -->
    <path d="M 70 60 Q 70 35 100 35 Q 130 35 130 60" stroke="#059669" stroke-width="3" fill="none"/>
    
    <!-- Handle connection points -->
    <circle cx="70" cy="60" r="3" fill="#059669"/>
    <circle cx="130" cy="60" r="3" fill="#059669"/>
    
    <!-- Divider line -->
    <line x1="50" y1="95" x2="150" y2="95" stroke="#86efac" stroke-width="2"/>
    
    <!-- Briefcase compartments -->
    <rect x="60" y="70" width="15" height="20" fill="#86efac" rx="2"/>
    <rect x="82" y="70" width="15" height="20" fill="#86efac" rx="2"/>
    <rect x="104" y="70" width="15" height="20" fill="#86efac" rx="2"/>
    <rect x="126" y="70" width="15" height="20" fill="#86efac" rx="2"/>
    
    <!-- Bottom details -->
    <rect x="65" y="105" width="20" height="15" fill="#a7f3d0" rx="2" opacity="0.7"/>
    <rect x="92" y="105" width="20" height="15" fill="#a7f3d0" rx="2" opacity="0.7"/>
    <rect x="119" y="105" width="20" height="15" fill="#a7f3d0" rx="2" opacity="0.7"/>
  </g>
  
  <!-- Document/Paper inside -->
  <rect x="60" y="115" width="25" height="10" fill="#fbbf24" opacity="0.6" rx="2"/>
</svg>