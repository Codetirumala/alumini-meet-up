<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f0fdf4"/>
  
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dcfce7" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#grid)"/>
  
  <!-- Central node -->
  <circle cx="200" cy="200" r="30" fill="#10b981" stroke="#059669" stroke-width="3"/>
  <circle cx="200" cy="200" r="20" fill="#86efac"/>
  <text x="200" y="210" font-size="24" text-anchor="middle" fill="#047857">🎓</text>
  
  <!-- Connected nodes -->
  <!-- Top-left -->
  <line x1="200" y1="200" x2="120" y2="100" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <circle cx="120" cy="100" r="20" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
  <text x="120" y="108" font-size="16" text-anchor="middle">💼</text>
  
  <!-- Top-right -->
  <line x1="200" y1="200" x2="280" y2="100" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <circle cx="280" cy="100" r="20" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
  <text x="280" y="108" font-size="16" text-anchor="middle">👨</text>
  
  <!-- Right -->
  <line x1="200" y1="200" x2="320" y2="200" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <circle cx="320" cy="200" r="20" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
  <text x="320" y="208" font-size="16" text-anchor="middle">👩</text>
  
  <!-- Bottom-right -->
  <line x1="200" y1="200" x2="280" y2="300" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <circle cx="280" cy="300" r="20" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
  <text x="280" y="308" font-size="16" text-anchor="middle">🚀</text>
  
  <!-- Bottom-left -->
  <line x1="200" y1="200" x2="120" y2="300" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <circle cx="120" cy="300" r="20" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
  <text x="120" y="308" font-size="16" text-anchor="middle">🤝</text>
  
  <!-- Left -->
  <line x1="200" y1="200" x2="80" y2="200" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <circle cx="80" cy="200" r="20" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
  <text x="80" y="208" font-size="16" text-anchor="middle">💡</text>
</svg>