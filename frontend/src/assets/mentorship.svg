<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Mentor (left) -->
  <g>
    <!-- Head -->
    <circle cx="80" cy="60" r="20" fill="#059669"/>
    
    <!-- Body -->
    <rect x="65" y="85" width="30" height="50" rx="5" fill="#10b981"/>
    
    <!-- Arms -->
    <rect x="45" y="95" width="20" height="10" rx="5" fill="#f59e0b"/>
    <rect x="95" y="95" width="20" height="10" rx="5" fill="#f59e0b"/>
    
    <!-- Legs -->
    <rect x="70" y="140" width="8" height="40" fill="#1f2937"/>
    <rect x="82" y="140" width="8" height="40" fill="#1f2937"/>
  </g>
  
  <!-- Mentee (right) -->
  <g>
    <!-- Head -->
    <circle cx="320" cy="80" r="18" fill="#059669"/>
    
    <!-- Body -->
    <rect x="307" y="105" width="26" height="45" rx="5" fill="#10b981"/>
    
    <!-- Arms -->
    <rect x="290" y="113" width="17" height="9" rx="4" fill="#f59e0b"/>
    <rect x="333" y="113" width="17" height="9" rx="4" fill="#f59e0b"/>
    
    <!-- Legs -->
    <rect x="312" y="155" width="7" height="35" fill="#1f2937"/>
    <rect x="323" y="155" width="7" height="35" fill="#1f2937"/>
  </g>
  
  <!-- Connection arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
  </defs>
  
  <path d="M 110 100 Q 200 80 290 120" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Lightbulb (idea) above arrow -->
  <g transform="translate(200, 50)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <rect x="-2" y="12" width="4" height="8" fill="#f59e0b"/>
    <rect x="-6" y="20" width="12" height="3" fill="#f59e0b"/>
  </g>
  
  <!-- Text labels -->
  <text x="80" y="240" font-size="13" fill="#047857" text-anchor="middle" font-weight="600">Mentor</text>
  <text x="320" y="240" font-size="13" fill="#047857" text-anchor="middle" font-weight="600">Mentee</text>
  
  <!-- Central text -->
  <text x="200" y="270" font-size="12" fill="#64748b" text-anchor="middle">Knowledge Transfer • Growth • Success</text>
</svg>