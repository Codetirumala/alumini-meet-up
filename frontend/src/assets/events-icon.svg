<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  
  <!-- Calendar -->
  <g>
    <!-- Main calendar body -->
    <rect x="45" y="55" width="110" height="100" rx="6" fill="#10b981" stroke="#059669" stroke-width="2"/>
    
    <!-- Calendar header -->
    <rect x="45" y="55" width="110" height="25" fill="#059669" rx="6"/>
    
    <!-- Month label -->
    <text x="100" y="75" font-size="12" fill="white" text-anchor="middle" font-weight="700">January</text>
    
    <!-- Day grid -->
    <!-- Row 1 -->
    <circle cx="62" cy="90" r="6" fill="#86efac"/>
    <text x="62" y="93" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">1</text>
    
    <circle cx="87" cy="90" r="6" fill="#86efac"/>
    <text x="87" y="93" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">2</text>
    
    <circle cx="112" cy="90" r="6" fill="#86efac"/>
    <text x="112" y="93" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">3</text>
    
    <circle cx="137" cy="90" r="6" fill="#86efac"/>
    <text x="137" y="93" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">4</text>
    
    <!-- Row 2 -->
    <circle cx="62" cy="115" r="6" fill="#86efac"/>
    <text x="62" y="118" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">5</text>
    
    <circle cx="87" cy="115" r="6" fill="#a7f3d0"/>
    <text x="87" y="118" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">6</text>
    
    <!-- Highlight event date -->
    <circle cx="112" cy="115" r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <text x="112" y="119" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
    
    <circle cx="137" cy="115" r="6" fill="#86efac"/>
    <text x="137" y="118" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">8</text>
    
    <!-- Row 3 (partial) -->
    <circle cx="62" cy="140" r="6" fill="#86efac"/>
    <text x="62" y="143" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">9</text>
    
    <circle cx="87" cy="140" r="6" fill="#86efac"/>
    <text x="87" y="143" font-size="10" fill="#047857" text-anchor="middle" font-weight="600">10</text>
  </g>
  
  <!-- Clock/Time indicator -->
  <circle cx="160" cy="145" r="20" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
  <line x1="160" y1="130" x2="160" y2="145" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="145" x2="168" y2="145" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>